<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Bank System</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f7f9fc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(31, 79, 130, 0.12);
            padding: 32px;
        }

        .brand {
            font-size: 14px;
            font-weight: bold;
            color: #1f4f82;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 24px;
            color: #6b7280;
            font-size: 15px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 18px;
            border: 1px solid #d7deea;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #1f4f82;
            box-shadow: 0 0 0 4px rgba(31, 79, 130, 0.10);
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            background: #1f4f82;
            color: white;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: #173d66;
        }

        .bottom-text {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #6b7280;
        }

        .bottom-text a {
            color: #1f4f82;
            text-decoration: none;
            font-weight: 600;
        }

        .bottom-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">BANK SYSTEM</div>
        <h1>Вход</h1>
        <p class="subtitle">Введите логин и пароль, чтобы войти в систему.</p>

        <form action="/login" method="POST">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" placeholder="Введите email" required>

            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="Введите пароль" required>

            <button type="submit" class="btn">Войти</button>
        </form>

        <div class="bottom-text">
            Нет аккаунта? <a href="/register">Зарегистрироваться</a>
        </div>
    </div>
</body>
</html>
